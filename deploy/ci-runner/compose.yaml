name: literature-review-ci
services:
  runner:
    build: .
    image: literature-review-ci-runner:2.337.0-bun1.3.14
    restart: unless-stopped
    init: true
    stop_grace_period: 2m
    environment:
      RUNNER_MANUALLY_TRAP_SIG: "1"
    cpus: 2
    mem_limit: 2g
    pids_limit: 512
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    volumes:
      - runner:/runner
      - home:/home/runner
      - tools:/opt/hostedtoolcache
      - work:/work
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
volumes:
  runner:
  home:
  tools:
  work:
